name: WorkLog Android

# The Android SDK cannot be downloaded from the agent sandbox that authors this
# repo (dl.google.com is blocked by network policy), so this workflow is where
# the Android module is actually compiled, tested, linted and bundled.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'apps/worklog-android/**'
      - '.github/workflows/worklog-android.yml'
  pull_request:
    paths:
      - 'apps/worklog-android/**'
      - '.github/workflows/worklog-android.yml'

concurrency:
  group: worklog-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # apps/worklog-android is the Gradle root; every ./gradlew call runs there.
  PROJECT_DIR: apps/worklog-android

jobs:
  build:
    name: Build, test and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Java 21, not 17: Robolectric refuses to build a sandbox for Android
      # SDK 36 on anything older ("Android SDK 36 requires Java 21"). AGP 8.13
      # runs happily on 21, and the app's own bytecode target stays at 17 -
      # that is set by compileOptions/jvmTarget, independent of the JDK the
      # build runs on.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Only what the build declares it needs: compileSdk 36, the build-tools
      # AGP 8.13 pairs with, and platform-tools. No extra system images.
      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Confirm the SDK is visible to Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          # settings.gradle.kts only includes :app when an SDK is present, so a
          # missing SDK would silently skip the entire Android module rather
          # than fail. Assert it is there before anything else runs.
          ./gradlew projects --no-daemon | tee /tmp/projects.txt
          grep -q "Project ':app'" /tmp/projects.txt \
            || { echo "::error::':app' was not included - the Android SDK was not detected."; exit 1; }

      - name: Configure AdMob IDs
        env:
          ADMOB_APP_ID: ${{ secrets.WORKLOG_ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.WORKLOG_ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.WORKLOG_ADMOB_INTERSTITIAL_UNIT_ID }}
        run: |
          set -euo pipefail
          # No values are printed. The build falls back to Google's public test
          # IDs when these are absent, which is a valid build - just not one
          # that can serve live ads.
          if [ -n "${ADMOB_APP_ID:-}" ]; then
            echo "ADMOB_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Production AdMob IDs supplied."
          else
            echo "ADMOB_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::No production AdMob IDs configured - building with Google test ad IDs."
          fi

      - name: Core unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Assemble debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: App unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:lint --no-daemon --stacktrace

      # The keystore never exists in the repo. If the secret is absent the
      # build falls back to the debug signature (see app/build.gradle.kts), so
      # a bundle is still produced - it just cannot be uploaded to Play.
      - name: Restore upload keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKLOG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORKLOG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORKLOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORKLOG_KEY_PASSWORD }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload keystore in secrets - the release bundle will carry the debug signature and is NOT uploadable to Play."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          # Written, never echoed. keystore.properties is git-ignored.
          umask 077
          {
            echo "store.file=upload-keystore.jks"
            echo "store.password=${KEYSTORE_PASSWORD}"
            echo "key.alias=${KEY_ALIAS}"
            echo "key.password=${KEY_PASSWORD}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Upload keystore restored."

      - name: Assemble release (R8 / minify enabled)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          WORKLOG_ADMOB_APP_ID: ${{ secrets.WORKLOG_ADMOB_APP_ID }}
          WORKLOG_ADMOB_BANNER_UNIT_ID: ${{ secrets.WORKLOG_ADMOB_BANNER_UNIT_ID }}
          WORKLOG_ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.WORKLOG_ADMOB_INTERSTITIAL_UNIT_ID }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Bundle release (AAB)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          WORKLOG_ADMOB_APP_ID: ${{ secrets.WORKLOG_ADMOB_APP_ID }}
          WORKLOG_ADMOB_BANNER_UNIT_ID: ${{ secrets.WORKLOG_ADMOB_BANNER_UNIT_ID }}
          WORKLOG_ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.WORKLOG_ADMOB_INTERSTITIAL_UNIT_ID }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Report signing identity
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "No AAB produced."; exit 0; }
          ls -lh "$AAB"
          # Print the certificate of whatever signed the bundle. This is what
          # distinguishes a real upload-key signature from the debug fallback.
          # No secret is printed - only the public certificate.
          # Public certificate only - no key material is printed.
          keytool -printcert -jarfile "$AAB" | sed -n '1,14p' \
            || echo "Could not read the certificate from the bundle."
          echo "Signed with upload key: ${{ steps.signing.outputs.signed }}"

      - name: Clean up signing material
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: rm -f upload-keystore.jks keystore.properties

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worklog-release
          if-no-files-found: warn
          retention-days: 30
          path: |
            apps/worklog-android/app/build/outputs/bundle/release/*.aab
            apps/worklog-android/app/build/outputs/apk/release/*.apk
            apps/worklog-android/app/build/outputs/mapping/release/mapping.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worklog-reports
          if-no-files-found: warn
          retention-days: 30
          path: |
            apps/worklog-android/app/build/reports/**
            apps/worklog-android/core/build/reports/**
            apps/worklog-android/app/build/test-results/**
            apps/worklog-android/core/build/test-results/**

      # Google Maven is unreachable from the sandbox that edits this repo, so
      # dependency versions cannot be checked there. Print the current ones
      # here. Temporary - remove once the versions are settled.
      - name: Probe dependency versions
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          base=https://dl.google.com/dl/android/maven2
          probe() {
            printf '%-45s ' "$1"
            curl -sf "$base/$(echo "$1" | tr '.:' '//')/maven-metadata.xml" \
              | grep -oE '<version>[^<]+</version>' | sed 's/<[^>]*>//g' \
              | grep -vE 'alpha|beta|rc|dev' | tail -3 | tr '\n' ' '
            echo
          }
          probe androidx.compose:compose-bom
          probe androidx.room:room-runtime
          probe androidx.glance:glance-appwidget
          probe androidx.work:work-runtime-ktx
          probe androidx.lifecycle:lifecycle-runtime-ktx
          probe androidx.activity:activity-compose
          probe androidx.navigation:navigation-compose
          probe androidx.datastore:datastore-preferences
          probe androidx.core:core-ktx
          probe com.google.android.gms:play-services-ads
          probe com.google.android.ump:user-messaging-platform

      # Artifact storage is not reachable from the environment that maintains
      # this workflow, so a failing test has to be legible in the log itself.
      - name: Summarize test failures
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          found = False
          for path in sorted(glob.glob("**/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      found = True
                      print("=" * 78)
                      print(f'{case.get("classname")}.{case.get("name")}')
                      print("-" * 78)
                      print((bad.get("message") or "").strip()[:800])
                      body = (bad.text or "").strip().splitlines()
                      for line in body[:25]:
                          print("   ", line[:200])
                      print()
          if not found:
              print("No failing test cases found in the JUnit XML.")
          PY
